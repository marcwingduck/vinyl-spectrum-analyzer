[env:adafruit_matrixportal_esp32s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
lib_deps =
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0
	adafruit/Adafruit GFX Library
	kosme/arduinoFFT@^2.0.4
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
monitor_speed = 115200
; the code applies its own gamma (rgb(), artGamma), so the library must not add CIE1931;
; 3.1.0 only defaults the color depth inside its CIE1931 tables, so it has to be given too
build_flags = -DNO_CIE1931 -DPIXEL_COLOR_DEPTH_BITS=8

; pioarduino's platform: Arduino core 3.3.11 on ESP-IDF 5.5, for the ADC's continuous driver
; (esp_adc/adc_continuous.h). PlatformIO's own platform shipped core 2.0.17 until 8.0.0.
; Not 55.03.312: it wants PlatformIO Core >= 6.2.0, and 6.2.0 calls itself 6.2.0.post1,
; which the check reads as a pre-release below 6.2.0.
[env:adafruit_matrixportal_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = adafruit_matrixportal_esp32s3
framework = arduino
lib_deps =
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0
	adafruit/Adafruit GFX Library@1.13.0
	kosme/arduinoFFT@2.0.4
	olikraus/U8g2_for_Adafruit_GFX@1.8.0
monitor_speed = 115200
